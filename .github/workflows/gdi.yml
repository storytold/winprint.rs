name: RGB driver transport
on:
  workflow_dispatch:
  push:
    branches: [main, codex/shared-rgb-print-20261013]
    paths: ['crates/gdi/**', '.github/workflows/gdi.yml']
  pull_request:
    paths: ['crates/gdi/**', '.github/workflows/gdi.yml']
permissions:
  contents: read
concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # run (main, manual) gets a group of its own, so it is neither cancelled nor replaced while queued.
  group: gdi-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gdi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --manifest-path crates/gdi/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/gdi/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path crates/gdi/Cargo.toml --locked
      - if: runner.os == 'Linux'
        run: cargo check --manifest-path crates/gdi/Cargo.toml --target wasm32-unknown-unknown --locked
